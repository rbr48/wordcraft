  <rect x="25" y="14" width="8" height="3" rx="1" fill="#A7F3D0"/>
  <rect x="14" y="22" width="6" height="3" rx="1" fill="#A7F3D0"/>
  <rect x="25" y="22" width="9" height="3" rx="1" fill="#FFFFFF"/>
