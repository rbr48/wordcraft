# Izhaan Intellect Office Suite · Production Nginx Configuration
# Domain: office.izhaanintellect.fun

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name office.izhaanintellect.fun;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server Block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name office.izhaanintellect.fun;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/office.izhaanintellect.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/office.izhaanintellect.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Root: Office Suite Portal Landing Page
    root /var/www/office/portal;
    index index.html;

    # Security & Performance Headers
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "clipboard-read=*, clipboard-write=*" always;

    # Enable Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/wasm
        text/javascript
        application/javascript
        text/css
        text/plain
        application/json
        image/svg+xml;

    # --- Root Portal (/) ---
    location / {
        try_files $uri $uri/ /index.html;
        location ~* \.(css|js|svg|png|jpg|ico)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # --- WordCraft Web App (/word/) ---
    location /word/ {
        alias /var/www/office/apps/word/;
        index index.html;
        try_files $uri $uri/ /word/index.html;

        # Mandatory WebAssembly & Script MIME types
        types {
            application/wasm wasm;
            text/javascript js;
            text/html html;
            text/css css;
            image/svg+xml svg;
        }

        # Immutable cache for content-hashed WASM and JS chunks
        location ~* \.(wasm|js)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin *;
        }

        # Fast revalidation for the HTML shell
        location ~* index\.html$ {
            add_header Cache-Control "no-cache";
        }
    }

    # --- Future Apps (SheetCraft & SlideCraft Slots) ---
    location /sheet/ {
        alias /var/www/office/apps/sheet/;
        index index.html;
        try_files $uri $uri/ /sheet/index.html;
        types {
            application/wasm wasm;
            text/javascript js;
            text/html html;
        }
    }

    location /slide/ {
        alias /var/www/office/apps/slide/;
        index index.html;
        try_files $uri $uri/ /slide/index.html;
        types {
            application/wasm wasm;
            text/javascript js;
            text/html html;
        }
    }

    error_page 404 /index.html;
}
