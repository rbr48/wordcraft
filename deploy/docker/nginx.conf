# Nginx configuration for Docker containerized Izhaan Intellect Office Portal

server {
    listen 80;
    listen [::]:80;
    server_name office.izhaanintellect.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS if SSL certificates exist, otherwise serve directly
    location / {
        root /var/www/office/portal;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /word/ {
        alias /var/www/office/apps/word/;
        index index.html;
        try_files $uri $uri/ /word/index.html;

        types {
            application/wasm wasm;
            text/javascript js;
            text/html html;
            text/css css;
            image/svg+xml svg;
        }

        location ~* \.(wasm|js)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~* index\.html$ {
            add_header Cache-Control "no-cache";
        }
    }
}
