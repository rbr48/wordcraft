<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2b579a">
  <title>WordCraft · Izhaan Intellect Office</title>
  <link data-trunk rel="rust" data-bin="wordcraft-web" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      width: 100dvw;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #e6e6e6;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }
    #wordcraft_canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #wordcraft_loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #555;
      font: 14px system-ui, sans-serif;
      pointer-events: none;
    }
    #back_to_portal {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 9999;
      background: rgba(17, 24, 39, 0.85);
      color: #f8fafc;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      padding: 6px 14px;
      font: 500 12px system-ui, -apple-system, sans-serif;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    @media (max-width: 600px) {
      #back_to_portal {
        bottom: 8px;
        right: 8px;
        padding: 4px 10px;
        font-size: 11px;
        opacity: 0.85;
      }
    }
  </style>
</head>
<body>
  <canvas id="wordcraft_canvas"></canvas>
  <div id="wordcraft_loading">Loading WordCraft&hellip;</div>
  <a href="https://office.izhaanintellect.fun" id="back_to_portal">
    <span style="color: #60a5fa; font-weight: bold;">←</span> Office Portal
  </a>
</body>
</html>
